<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Beard preview</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #ddd;
        font-family: system-ui, sans-serif;
      }
      .row {
        display: flex;
        gap: 24px;
        padding: 24px;
        align-items: flex-start;
      }
      figure {
        margin: 0;
      }
      figcaption {
        margin-top: 8px;
        font-size: 13px;
        color: #333;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        background: #ddd;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <figure>
        <canvas id="big" width="256" height="256"></canvas>
        <figcaption>256px (overlay alone)</figcaption>
      </figure>
      <figure>
        <canvas id="fav" width="32" height="32"></canvas>
        <figcaption>32px on a sample favicon</figcaption>
      </figure>
      <figure>
        <canvas id="favBig" width="256" height="256"></canvas>
        <figcaption>Same 32px look, scaled up</figcaption>
      </figure>
    </div>
    <script>
      function drawGoatee(ctx, size = 32) {
        const s = size / 32;
        ctx.save();
        const hair = new Path2D();

        hair.moveTo(6 * s, 17.6 * s);
        hair.quadraticCurveTo(9 * s, 15.8 * s, 12.5 * s, 16.2 * s);
        hair.quadraticCurveTo(16 * s, 16.5 * s, 19.5 * s, 16.2 * s);
        hair.quadraticCurveTo(23 * s, 15.8 * s, 26 * s, 17.6 * s);
        hair.lineTo(26.8 * s, 20.2 * s);
        hair.lineTo(27.2 * s, 24.5 * s);
        hair.lineTo(25.5 * s, 28.8 * s);
        hair.lineTo(20 * s, 31.2 * s);
        hair.lineTo(12 * s, 31.2 * s);
        hair.lineTo(6.5 * s, 28.8 * s);
        hair.lineTo(4.8 * s, 24.5 * s);
        hair.lineTo(5.2 * s, 20.2 * s);
        hair.closePath();

        hair.moveTo(10.5 * s, 18.6 * s);
        hair.ellipse(16 * s, 19.6 * s, 5.4 * s, 1.7 * s, 0, 0, Math.PI * 2);
        hair.closePath();

        hair.moveTo(9.2 * s, 21.4 * s);
        hair.lineTo(22.8 * s, 21.4 * s);
        hair.lineTo(23.4 * s, 24.8 * s);
        hair.lineTo(21.5 * s, 27.6 * s);
        hair.lineTo(10.5 * s, 27.6 * s);
        hair.lineTo(8.6 * s, 24.8 * s);
        hair.closePath();

        ctx.strokeStyle = "rgba(255, 255, 255, 0.7)";
        ctx.lineWidth = 1.15 * s;
        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        ctx.stroke(hair);

        ctx.fillStyle = "#1a100a";
        ctx.fill(hair, "evenodd");

        ctx.fillStyle = "rgba(255, 255, 255, 0.14)";
        ctx.beginPath();
        ctx.ellipse(16 * s, 17.2 * s, 6 * s, 0.7 * s, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function checker(ctx, size, cell) {
        for (let y = 0; y < size; y += cell) {
          for (let x = 0; x < size; x += cell) {
            ctx.fillStyle = (x / cell + y / cell) % 2 === 0 ? "#ececec" : "#cfcfcf";
            ctx.fillRect(x, y, cell, cell);
          }
        }
      }

      function sampleFavicon(ctx, size) {
        ctx.fillStyle = "#4a90d9";
        ctx.beginPath();
        ctx.arc(size / 2, size / 2, size / 2 - 1, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#1e2a44";
        for (const [ex, ey] of [
          [0.38, 0.36],
          [0.62, 0.36],
        ]) {
          ctx.beginPath();
          ctx.arc(size * ex, size * ey, size * 0.06, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      const big = document.getElementById("big");
      const bigCtx = big.getContext("2d");
      checker(bigCtx, 256, 16);
      drawGoatee(bigCtx, 256);

      const fav = document.getElementById("fav");
      const favCtx = fav.getContext("2d");
      sampleFavicon(favCtx, 32);
      drawGoatee(favCtx, 32);

      const favBig = document.getElementById("favBig");
      const favBigCtx = favBig.getContext("2d");
      favBigCtx.imageSmoothingEnabled = false;
      favBigCtx.drawImage(fav, 0, 0, 256, 256);
    </script>
  </body>
</html>
